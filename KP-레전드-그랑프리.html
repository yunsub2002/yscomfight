<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K·P 레전드 그랑프리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Press+Start+2P&display=swap">
<style>
/* 한 화면 아케이드 캐비닛: 위에 게임 화면, 아래에 메뉴 패널. 자두빛 밤 무대 + 금색 챔피언 벨트 + 청·홍 코너 */
:root{
  --bg:#120d1c; --panel:#1d1530; --panel2:#281d42; --line:#3d2f60;
  --ink:#f3ecd8; --dim:#a99cc4; --gold:#f5b82e; --red:#e2412f; --blue:#3a7bd5; --green:#5fc46a;
  --f-disp:"Black Han Sans","Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-px:"Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 24px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border:3px solid var(--line);box-shadow:0 0 0 3px #000,0 10px 40px #0008;image-rendering:pixelated;overflow:hidden}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
#pauseBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(4px + env(safe-area-inset-bottom,0px));font:11px var(--f-px);background:#000b;color:var(--ink);border:2px solid var(--line);min-width:44px;min-height:36px;padding:6px 10px;cursor:pointer}
#pov{position:absolute;inset:0;background:#0a0612e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
#pov[hidden],#hint[hidden]{display:none!important}
#pov h3{font-size:clamp(22px,5vw,34px);color:var(--gold)}
#pov .row{justify-content:center}
#pov p{font-size:14px;max-width:46ch}
#hint{display:none;font-size:13px;color:var(--dim);text-align:center;line-height:1.4}
body.fight #hint{display:block}
#panel{background:var(--panel);border:3px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;color:var(--gold);letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:400;font-size:19px;margin:0;color:var(--ink)}
p{margin:0;line-height:1.5;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--f-ui);font-size:18px;color:var(--ink);background:var(--panel2);border:none;padding:10px 16px;cursor:pointer;box-shadow:inset -3px -3px 0 #0006,inset 3px 3px 0 #ffffff14,0 0 0 2px #000;min-height:44px}
.btn:hover,.btn:focus-visible{background:#3a2a5e;outline:none}
.btn:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.btn.gold{background:var(--gold);color:#2a1800}
.btn.red{background:var(--red)}
.btn.blue{background:var(--blue)}
.btn.sel{outline:3px solid var(--gold);outline-offset:-3px}
.btn small{display:block;font-size:13px;color:var(--dim)}
.btn.gold small{color:#5a3a00}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.big .btn{text-align:left;padding:14px 16px;font-size:21px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn{font-size:16px;padding:6px 12px;min-height:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.card{background:#0d0916;border:2px solid var(--line);padding:4px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font-family:var(--f-ui);min-height:44px}
.card canvas{width:56px;height:60px;image-rendering:pixelated}
.card span{font-size:13px;line-height:1.1;text-align:center;word-break:keep-all}
.card .org{font:7px var(--f-px);color:var(--dim)}
.card:hover,.card:focus-visible{border-color:var(--gold);outline:none}
.card.p1{border-color:var(--red);background:#2a0d12}
.card.p2{border-color:var(--blue);background:#0d1630}
.card.in{border-color:var(--gold);background:#2a2008}
.info{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:#0d0916;border:2px solid var(--line);padding:10px;min-width:0}
.info canvas{width:96px;height:102px;image-rendering:pixelated;background:linear-gradient(#2a1d48,#0d0916)}
.info .nm{font-family:var(--f-disp);font-size:22px;color:var(--ink)}
.info .nk{color:var(--gold);font-size:15px}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:3px 14px;margin-top:6px}
.bar{display:grid;grid-template-columns:62px 1fr 26px;gap:6px;align-items:center;font-size:13px;color:var(--dim)}
.bar i{display:block;height:7px;background:#2a2140}
.bar i b{display:block;height:100%;background:var(--gold)}
.bar em{font:8px var(--f-px);font-style:normal;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.vs .side{min-width:0}
.vs .mid{font:14px var(--f-px);color:var(--gold)}
.bracket{overflow-x:auto;padding-bottom:6px}
.bk{display:flex;gap:14px;min-width:max-content}
.bk .col{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:150px}
.bk .col h4{margin:0;font:9px var(--f-px);color:var(--dim)}
.bm{background:#0d0916;border:2px solid var(--line);font-size:14px}
.bm div{padding:3px 6px;display:flex;justify-content:space-between;gap:6px}
.bm div+div{border-top:1px solid var(--line)}
.bm .w{color:var(--gold)}
.bm .l{color:#6e6388;text-decoration:line-through}
.bm .me{color:var(--red)}
.bm.now{border-color:var(--gold)}
.bm small{font-size:11px;color:var(--dim)}
table{border-collapse:collapse;font-size:15px}
td,th{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--dim)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.keys div{background:#0d0916;border:2px solid var(--line);padding:10px;line-height:1.6;font-size:15px}
kbd{font:9px var(--f-px);background:#2a2140;border:1px solid var(--line);padding:2px 4px;color:var(--ink)}
/* 터치 패드 */
#pad{display:none;justify-content:space-between;align-items:center;gap:10px;touch-action:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#pad.on{display:flex}
.dp{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,58px);gap:5px}
.pb{background:var(--panel2);border:none;color:var(--ink);font:13px var(--f-px);box-shadow:inset -3px -3px 0 #0006,0 0 0 2px #000;touch-action:none;-webkit-touch-callout:none}
.pb.on{background:#5a4790}
.ab{display:grid;grid-template-columns:repeat(2,78px);grid-template-rows:repeat(2,74px);gap:10px}
.ab .pb{border-radius:50%;font-family:var(--f-ui);font-size:19px;line-height:1.05}
.ab .pb small{display:block;font-size:11px;opacity:.85}
.ab .s.ready{animation:rdy .5s steps(2) infinite}
@keyframes rdy{50%{filter:brightness(1.6);box-shadow:0 0 0 3px #fff,0 0 18px var(--gold)}}
body.fight #panel{display:none}
body.fight{padding-block:6px 10px}
body.fight #app{gap:8px}
@media (orientation:landscape) and (max-height:540px) and (pointer:coarse){
  body.fight{padding:0;overflow:hidden}
  body.fight #app{max-width:none;height:100dvh;align-items:center;justify-content:center}
  body.fight #stage{height:100dvh;width:auto;max-width:100vw;border:none;box-shadow:none}
  body.fight #pad{position:fixed;left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));pointer-events:none;background:none}
  body.fight #pad .pb{pointer-events:auto;opacity:.6}
  body.fight #pad .dp{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,50px)}
  body.fight #pad .ab{grid-template-columns:repeat(2,68px);grid-template-rows:repeat(2,64px)}
  body.fight #hint{display:none}
}
.ab .p{background:var(--red)} .ab .k{background:var(--blue)} .ab .g{background:#2f8a4a} .ab .s{background:var(--gold);color:#2a1800}
.ab .pb.on{filter:brightness(1.4)}
@media (max-width:560px){h2{font-size:22px}.big .btn{font-size:18px}.big{grid-template-columns:1fr 1fr}.dp{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,52px);gap:4px}.ab{grid-template-columns:repeat(2,72px);grid-template-rows:repeat(2,68px);gap:8px}.grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}.info{grid-template-columns:1fr}.info canvas{width:80px;height:85px}.vs{grid-template-columns:1fr}.vs .mid{text-align:center}}
@media (max-width:360px){.dp{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}.ab{grid-template-columns:repeat(2,62px);grid-template-rows:repeat(2,60px)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="app">
  <div id="stage"><canvas id="cv" width="1280" height="720"></canvas><button id="pauseBtn" hidden aria-label="일시정지">II</button>
    <div id="pov" hidden><h3>일시정지</h3><div class="row"><button class="btn gold" id="povGo">계속하기</button><button class="btn" id="povFs">전체 화면</button><button class="btn red" id="povQuit">경기 포기·메뉴</button></div>
    <p>▲+펀치 훅 · ▼+펀치 보디/어퍼 · ▶+펀치 스트레이트<br>▼+킥 로킥 · ▲/▶+킥 하이킥 · ◀+킥 앞차기 · 붙어서 킥 니킥<br>가드 꾹 = 방어 · 필살 버튼이 반짝이면 필살기</p></div></div>
  <div id="pad">
    <div class="dp">
      <span></span><button class="pb" data-k="u">▲</button><span></span>
      <button class="pb" data-k="l">◀</button><button class="pb" data-k="d" style="font-family:var(--f-ui);font-size:16px">가드</button><button class="pb" data-k="r">▶</button>
      <span></span><button class="pb" data-k="d">▼</button><span></span>
    </div>
    <div class="ab">
      <button class="pb g" data-k="g">잡기<small>클린치·태클</small></button><button class="pb s" data-k="s">필살</button>
      <button class="pb p" data-k="p">펀치</button><button class="pb k" data-k="k">킥</button>
    </div>
  </div>
  <div id="hint">▲+펀치 훅 · ▶+펀치 스트레이트 · ▼+킥 로킥 · ▲+킥 하이킥 · 붙어서 킥 니킥</div>
  <div id="panel"></div>
</div>

   ============================================================ */
const LW=320, LH=180, GY=156, SC=4;

const cv=document.getElementById('cv'), cx=cv.getContext('2d');
const buf=document.createElement('canvas'); buf.width=LW; buf.height=LH; const bx=buf.getContext('2d');
const lay=document.createElement('canvas'); lay.width=LW; lay.height=LH; const lx=lay.getContext('2d',{willReadFrequently:true});
cx.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s);
function layout(){const portrait=innerHeight>innerWidth&&innerWidth<760;const nv=portrait?192:256;if(nv!==VW||cv.width!==nv*Z){VW=nv;cv.width=VW*Z;cv.height=VH*Z;cx.imageSmoothingEnabled=false}const st=document.getElementById('stage');if(st)st.style.aspectRatio=VW+'/'+VH}
addEventListener('resize',()=>layout());addEventListener('orientationchange',()=>setTimeout(layout,200));

  G.ref.F={d:REF,dm:dims(REF),x:160,f:1,side:2,pa:P.refS,pb:P.refS,pt:1,pd:1,jy:0,legDmg:0};

function update(){

  if(G.paused)return;
  if(G.cut){G.cut.t++;if(G.cut.t>55)G.cut=null;else return}
  if(G.stop>0){G.stop--;return}
  if(G.slow>0){G.slow--;if(G.slow%3)return}
  const a=G.a,b=G.b;G.pt++;
  // 입력 수집
  const pr=PRESS.splice(0);
  if(G.phase==='intro'){
    [a,b].forEach(F=>{const tx=F.side?208:112;if(Math.abs(F.x-tx)>1){F.x+=Math.sign(tx-F.x)*1.4;if(G.pt%12===0)setPose(F,G.pt%24?'wk1':'wk2',10)}else if(F.pb!==P.st)setPose(F,'st',8)});
    if(G.pt===2)SFX.cheer();
    if(G.pt>200){G.phase='ready';G.pt=0;startRound()}
    stepFX();return;
  }
  if(G.phase==='ready'){if(G.pt===1){say('ROUND '+G.round,{life:70,c:'#f5b82e'});SFX.bell()}if(G.pt===70)say('FIGHT!',{life:50,size:56,c:'#ff5040'});if(G.pt>=80){G.phase='fight';G.pt=0}idleAnim(a);idleAnim(b);stepRef();stepFX();return}
  if(G.phase==='between'){stepCorner();stepFX();return}
  if(G.phase==='over'||G.phase==='decision'){stepOver();stepFX();return}
  if(G.phase==='count'){stepCount(pr);stepFX();return}
  if(G.phase==='break'){stepBreak();stepFX();return}
  // ---- fight ----
  pr.forEach(([pi,k])=>{const F=pi?b:a;if(F.ctrl==='human')cmd(F,k)});
  [a,b].forEach((F,i)=>{if(F.ctrl==='human'){const I=IN[i];F.walk=(I.r?1:0)-(I.l?1:0);F.guard=I.d?1:0;F.holdU=I.u?1:0}else ai(F)});
  if(G.sub){stepSub(pr)}
  else if(G.ground){stepGround()}
  else{stepStand(a);stepStand(b);separate()}
  // 시계
  G.clock+=rate()/60;
  const rl=G.rLen[Math.min(G.round-1,2)];
  if(G.phase==='fight'&&G.clock>=rl&&!G.res)endRound();
  stepRef();stepFX();
}

/* --- 서서 싸우기 --- */
function canAct(F){return F.st==='idle'||F.st==='walk'||F.st==='block'}
function cmd(F,k){
  if(G.phase!=='fight'||G.res)return;
  if(G.sub){if(G.sub.att===F||G.sub.def===F)mash(F);return}
  if(G.ground){groundCmd(F,k);return}
  const O=other(F);F.lastPress=G.fr;
  if(k==='g')F.lastG=G.fr;
  if(F.st==='clinch'){if(k==='k'||k==='p')startMove(F,'cknee');return}
  if(F.st==='atk'&&F.mv){const left=totalLeft(F);if(left<8)F.buf=k;return}
  if(!canAct(F))return;
  const I=IN[F.side&&G.mode==='vs2p'?1:0];
  const tw=(F.walk*F.f)>0, aw=(F.walk*F.f)<0, up=F.holdU, dn=F.guard, gp=gap(F,O);
  if(O.st==='down'&&G.rule==='P'){ // 다운된 상대 추격
    if(k==='g'||k==='p'){if(Math.abs(F.x-O.x)<90)pounce(F,O);return}
    if(k==='k'){startMove(F,'soccer');return}
  }
  if(k==='p'){startMove(F,up?'hook':dn?(gp<11?'upper':'body'):tw?'str':'jab')}
  else if(k==='k'){startMove(F,gp<9&&!dn&&!up?'knee':dn?'low':(up||tw)?'high':aw?'front':'mid')}
  else if(k==='g'){if(G.rule==='K'){if(gp<12)startClinch(F,O)}else{startShoot(F,O)}}
  else if(k==='s'){if(F.meter>=100)startSpecial(F)}
}
function totalLeft(F){let s=F.mv.k[F.mk][1]-F.mt;for(let i=F.mk+1;i<F.mv.k.length;i++)s+=F.mv.k[i][1];return s}
function startMove(F,id,sp){
  const mv=sp?SPMV[id]:MV[id];if(!mv)return;
  if(F.sta<mv.sta*.6&&!sp){return}
  F.mv=mv;F.mvId=id;F.mk=0;F.mt=0;F.st='atk';F.sp=!!sp;F.hitDone={};F.sta=Math.max(0,F.sta-mv.sta);
  const spd=.75+F.d.spd/400;F.mvSpd=spd*(.8+.2*F.sta/100);
  setPose(F,mv.k[0][0],Math.min(4,mv.k[0][1]));
}
function startSpecial(F){
  let sp=F.d.sp,nm=F.d.spn;const O=other(F);
  if(G.rule==='K'&&(sp==='bomb'||SUBSP[sp])){sp=F.d.pun>=F.d.kic?'rush':'highkick';nm=F.d.nm.split(' ').pop()+(sp==='rush'?' 러시':' 하이킥')}
  if(SUBSP[sp])sp='grab';
  if(sp==='stomp'&&O.st==='down'&&G.rule==='P'){sp='stomp'}
  F.meter=0;startMove(F,sp,1);F.sta+=6;F.spName=nm;F.spType=F.d.sp;
  G.cut={F,t:0,name:nm};SFX.sp();
}
function stepStand(F){
  const O=other(F);
  if(F.cd>0)F.cd--;
  if(F.exT>0){F.exT--;if(!F.exT)F.ex='n'}
  F.sta=Math.min(100,F.sta+(F.st==='idle'||F.st==='block'?.12:.06)*(F.d.sta/80));
  F.stun=Math.max(0,F.stun-.22*(F.d.chin/85));
  F.legDmg=1-F.leg/100;
  F.pt++;
  if(F.jy>0&&F.st!=='atk')F.jy=Math.max(0,F.jy-1.5);
  switch(F.st){
  case 'idle':case 'walk':case 'block':{
    if(O.st!=='down'||G.rule!=='P')F.f=Math.sign(O.x-F.x)||F.f;
    if(F.buf){const k=F.buf;F.buf=null;cmd(F,k);if(F.st==='atk')break}
    if(F.guard){if(F.st!=='block'){F.st='block';setPose(F,'gd',4)}F.sta=Math.min(100,F.sta+.04);break}
    const sp=(.62+F.d.spd/240)*(1-F.legDmg*.45)*(.7+.3*F.sta/100);
    if(F.walk){const back=F.walk*F.f<0;F.x+=F.walk*sp*(back?.82:1);F.st='walk';F.stt++;if(F.stt%10===0)setPose(F,(F.stt/10)%2?'wk1':'wk2',9)}
    else{if(F.st!=='idle'){F.st='idle';F.stt=0}idleAnim(F)}
    break}
  case 'atk':{
    const mv=F.mv,key=mv.k[F.mk];F.mt+=F.mvSpd;
    const hits=mv.hits||[mv.hit];
    if(hits.includes(F.mk)&&F.mt>=2&&!F.hitDone[F.mk]){F.hitDone[F.mk]=1;F.hitIdx=hits.indexOf(F.mk);resolve(F,O,mv);if(!F.mv)return}
    if(F.holding&&F.mv){const O2=F.holding;O2.x=F.x+F.f*(F.dm.half*.4);O2.jy=F.mk===2?Math.min(26,O2.jy+2.4):F.mk===3?Math.max(0,O2.jy-6):O2.jy}
    if(mv.adv&&hits.includes(F.mk)&&F.mt<3)F.x+=F.f*mv.adv/3*(mv.cl?0:1);
    if(mv.jump){F.jy=F.mk===1?Math.min(16,F.mt*2.2):F.mk===2?16:Math.max(0,F.jy-2)}
    if(F.mt>=key[1]){F.mk++;F.mt=0;if(F.mk>=mv.k.length){F.mv=null;F.st=F.inClinch?'clinch':'idle';F.jy=0;if(F.inClinch)setPose(F,'clinch',6);break}
      const nk=mv.k[F.mk];setPose(F,nk[0],Math.min(4,nk[1]))}
    break}
  case 'hit':F.stt--;if(F.stt<=0){F.st='idle';setPose(F,'st',8)}break;
  case 'down':{
    F.stt--;
    if(G.rule==='P'&&F.stt<=0&&F.hp>0){F.st='getup';F.stt=26;setPose(F,'getup',12)}
    break}
  case 'getup':F.stt--;if(F.stt<=0){F.st='idle';setPose(F,'st',10);F.ex='n'}break;
  case 'clinch':{F.stt--;if(F.stt<=0){F.st='idle';F.inClinch=0;setPose(F,'st',8);F.x-=F.f*8}break}
  case 'shoot':{F.stt--;if(F.stt<=0){F.st='idle';setPose(F,'st',10)}break}
  case 'sprawled':{F.stt--;if(F.stt<=0){F.st='idle';setPose(F,'st',12)}break}
  case 'held':{if(O.holding!==F){F.st='idle';F.jy=0;setPose(F,'st',8)}break}
  case 'win':case 'lose':break;
  }
  F.x=clamp(F.x,40,280);
}
function idleAnim(F){F.pt++;if(F.pt>=F.pd&&(F.pb===P.st||F.pb===P.st2||F.pb===P.wk1||F.pb===P.wk2)){setPose(F,F.pb===P.st?'st2':'st',22)}else if(F.pt>F.pd+30&&F.pb!==P.st&&F.pb!==P.st2&&F.st==='idle')setPose(F,'st',8)}
function separate(){
  const a=G.a,b=G.b;if(a.st==='down'||b.st==='down')return;
  const min=(a.dm.half+b.dm.half)+2,dx=b.x-a.x;
  if(Math.abs(dx)<min){const push=(min-Math.abs(dx))/2,s=Math.sign(dx)||1;a.x-=s*push;b.x+=s*push;
    if(a.x<40){b.x+=40-a.x;a.x=40}if(b.x>280){a.x-=b.x-280;b.x=280}if(b.x<40){a.x+=40-b.x;b.x=40}if(a.x>280){b.x-=a.x-280;a.x=280}}
}
function resolve(A,B,mv){
  if(mv.h==='down'||A.mvId==='soccer'&&!A.sp){ // 쓰러진 상대에게 사커킥
    if(B.st==='down'&&G.rule==='P'&&Math.abs(A.x-B.x)<A.dm.half+B.dm.H*.6+10){land(A,B,mv,'head',1);if(B.hp<22){finish(A,'TKO','사커킥')}return}
    if(B.st==='down'){SFX.whiff();return}
  }
  if(B.st==='down'||B.st==='getup'){SFX.whiff();return}
  const g=gap(A,B),r=mv.rng*reach(A)+(mv.cl?40:0);
  if(g>r+2){SFX.whiff();if(mv.throw&&(A.hitIdx||0)===0){A.mv=null;A.st='idle';setPose(A,'st',10)}return}
  const hi=A.hitIdx||0;
  if(mv.throw){
    if(hi===0){if(G.rule!=='P'){return}B.st='held';B.mv=null;B.inClinch=0;A.holding=B;setPose(B,'downK',6);B.ex='hit';B.jy=4;say('잡았다!',{size:24,life:30,c:'#f5b82e',y:110});return}
    A.holding=null;B.jy=0;B.ex='hit';B.exT=40;land(A,B,mv,'body',0,1);shake(9);G.stop=10;SFX.down();say('SLAM!',{c:'#f5b82e',size:40,life:40});
    if(!G.res){if(B.hp<=0){finish(A,'KO',A.spName||'슬램');return}A.mv=null;startGround(A,B,A.d.grp-B.d.grp>8?'mount':'side')}return}
  if(mv.grab&&G.rule==='P'){const nm=A.spName||pick(SUBN.flying);A.mv=null;
    if(SUBSP[A.spType]==='top'){startGround(A,B,'side');startSub(A,B,nm,16)}else{startGround(B,A,'guard');startSub(A,B,nm,14)}return}
  let h=mv.hz?mv.hz[hi]:mv.h;if(mv.hd)mv=Object.assign({},mv,{dmg:mv.hd[hi]});
  const blocking=B.st==='block'&&(h!=='leg'||Math.random()<.45);
  const counter=B.st==='atk'&&B.mv&&B.mk<(B.mv.hit||B.mv.hits[0]);
  if(blocking){
    const red=mv.ub?mv.ub:.14;land(A,B,mv,h,0,0,red);SFX.block();spark(B,h,'#cfe3ff',4);B.x+=A.f*(2+mv.dmg*.25);
    if(A.sp)A.meter=Math.min(100,A.meter+2);return}
  land(A,B,mv,h,counter);
}
function land(A,B,mv,h,counter,quiet,red){
  const st=mv.t==='pun'?A.d.pun:mv.t==='kic'?A.d.kic:A.d.grp;
  const pow=.82+A.d.kg/520;
  let dmg=mv.dmg*(st/80)*pow*fMul(A)*rnd(.85,1.15)/Math.pow(B.d.def/80,.35);
  dmg*=.38;if(counter)dmg*=1.35;if(red)dmg*=red;
  if(G.mode!=='vs2p'&&G.mode!=='attract'&&G.mode!=='watch'){const dm=[.75,1,1.2][SET.diff];if(A.ctrl==='cpu')dmg*=dm;else dmg*=[1.25,1.05,.95][SET.diff]}

function judge(){
  const R=G.rounds,rule=G.rule;const cards=[];

    if(rule==='K'){R.forEach(([x,y])=>{const v=s=>s.dmg+s.hits*1.4+s.att*.6+rnd(-6,6);let A=10,B=10;const d=v(x)-v(y);if(d>4)B--;else if(d<-4)A--;A-=y.kd*0+x.kd*0;B-=x.kd;A-=y.kd;A=Math.max(A,7);B=Math.max(B,7);sa+=A;sb+=B});
      // 위에서 kd는 받은 쪽 기준: x.kd = a가 빼앗은 다운
    }else{let va=0,vb=0;R.forEach(([x,y])=>{va+=x.dmg+x.td*9+x.sub*6+x.top*.5+x.kd*14;vb+=y.dmg+y.td*9+y.sub*6+y.top*.5+y.kd*14});va*=rnd(.88,1.12);vb*=rnd(.88,1.12);sa=va>vb?1:0;sb=1-sa}

  let wa=0,wb=0;cards.forEach(([x,y])=>{if(x>y)wa++;else if(y>x)wb++});
  let draw=wa===wb||(wa<2&&wb<2);
  let win=wa>wb?0:1;
  if(draw&&(G.ext||rule==='P')){const t=(s)=>s.dmg+s.hits;const A=G.rounds.reduce((s,r)=>s+t(r[0]),0),B=G.rounds.reduce((s,r)=>s+t(r[1]),0);win=A>=B?0:1;draw=0;if(rule==='K'){cards.forEach(c=>{if(c[0]===c[1]){if(win===0)c[0]++;else c[1]++}});}else cards.forEach((c,i)=>{if(i<2){c[0]=win===0?1:0;c[1]=1-c[0]}})}

/* ---------- AI ---------- */
function ai(F){
  const O=other(F),A=F.ai;A.t--;
  const lvl=G.mode==='attract'||G.mode==='watch'?1.3:[.55,1,1.4][SET.diff];
  const d=F.d;
  if(G.ground||G.sub){
    if(G.sub)return;const g=G.ground;F.walk=0;
    if(A.t>0)return;A.t=Math.round(rnd(16,34)/lvl);
    const top=g.top===F;
    if(top){
      const gnpW=d.pun*.9+(g.pos==='mount'?40:g.pos==='side'?15:0), advW=d.grp*.8*(g.pos!=='mount'?1:0), subW=(g.pos!=='guard'?d.sub*.6:d.sub*.1);
      if(F.meter>=100&&Math.random()<.4){groundCmd(F,'s');return}
      if(g.quiet>500&&Math.random()<.3){F.walk=-F.f;A.t=40;return}
      const r=Math.random()*(gnpW+advW+subW);groundCmd(F,r<gnpW?'p':r<gnpW+advW?'k':'g');
    }else{
      if(F.meter>=100&&Math.random()<.4){groundCmd(F,'s');return}
      const subW=g.pos==='guard'?d.sub*.7:0,escW=d.grp*.7+30,hitW=g.pos==='guard'?20:10;
      if(g.pos==='guard'&&d.sub<70&&Math.random()<.25){F.walk=F.f;A.t=46;return}
      const r=Math.random()*(subW+escW+hitW);groundCmd(F,r<subW?'p':r<subW+escW?'g':'k');
    }
    return}
  if(F.st==='clinch'){if(A.t<=0){A.t=Math.round(rnd(10,26)/lvl);if(Math.random()<.6)cmd(F,'k')}return}
  F.guard=0;
  // 상대가 공격 준비 중이면 가드
  if(O.st==='atk'&&O.mv&&O.mk===0&&gap(F,O)<(O.mv.rng||20)*reach(O)+6){
    if(!A.react){A.react=1;if(Math.random()<.42*lvl*(d.def/85)&&canAct(F)){F.guard=1;A.gt=Math.round(rnd(14,26));}}
  }else A.react=0;
  if(A.gt>0){A.gt--;F.guard=1;F.walk=0;return}
  if(A.t>0)return;
  A.t=Math.round(rnd(14,34)/lvl);
  const g=gap(F,O);
  // 쓰러진 상대
  if(O.st==='down'){F.walk=0;if(G.rule==='P'){const pw=(d.grp+d.pun)/2;if(Math.random()<pw/160){if(F.d.sp==='soccer'||Math.random()<.25){F.walk=Math.sign(O.x-F.x);if(Math.abs(O.x-F.x)<O.dm.H*.6+F.dm.half+8)cmd(F,'k')}else if(Math.abs(O.x-F.x)<90)cmd(F,'g')}}return}
  if(!canAct(F)){return}
  const strike=(d.pun+d.kic)/2,grap=(d.grp+d.sub)/2;
  const hurt=F.hp<35;
  const pref=G.rule==='P'&&grap>strike+8?8:d.kic>d.pun?20:14;
  if(F.meter>=100&&g<(d.sp==='highkick'?28:18)&&Math.random()<.45){cmd(F,'s');return}
  if(G.rule==='P'&&g<24&&Math.random()<(grap/100)*.42*(grap>strike?1.4:.6)){cmd(F,'g');return}
  if(g>pref+6){F.walk=Math.sign(O.x-F.x)*(Math.random()<.85-(hurt?.3:0)?1:-1);return}
  if(g<2&&Math.random()<.35){F.walk=-Math.sign(O.x-F.x);A.t=10;return}
  F.walk=0;
  if(Math.random()<.22){F.guard=1;A.gt=14;return}
  if(Math.random()<.2){F.walk=-Math.sign(O.x-F.x);A.t=12;return}
  const legOpp=O.leg<60;
  const opts=[['jab',d.pun*.9],['str',d.pun*.8],['hook',g<14?d.pun*.7:0],['upper',g<9?d.pun*.5:0],['body',d.pun*.4],
    ['low',d.kic*(legOpp?.9:.55)+(d.sp==='lowkick'?30:0)],['mid',d.kic*.5],['high',d.kic*.45+(d.sp==='highkick'?20:0)],['knee',g<9?d.kic*.7:0],['front',g<6?20:4]];
  if(G.rule==='K'&&g<6&&Math.random()<.12){cmd(F,'g');return}
  let tot=opts.reduce((s,o)=>s+o[1],0),r=Math.random()*tot;for(const o of opts){r-=o[1];if(r<=0){startMove(F,o[0]);break}}
  if(Math.random()<.3*lvl)A.t=Math.round(A.t*.5);
}

function resultScreen(res,again,back,extra){

 <button class="btn" data-go="gpCfg" data-v="K16">K룰 16인 오픈<small>개막전 포함 대형 토너먼트</small></button>

NAV.gpPick=()=>{
  const s=SEL,n=FLOW.size,tabs=[['all','전체'],['K','K 계열'],['P','P 계열']];
  const flt=f=>s.tab==='all'||(s.tab==='K'&&f.org!=='P')||(s.tab==='P'&&f.org!=='K');

   ${s.a?`<p>내 선수 <b style="color:var(--red)">${s.a.nm}</b> · 직접 넣은 선수 ${s.ent.length}명 / 남은 자리 ${n-1-s.ent.length}명은 '자동 채우기'로 강한 순서 또는 무작위로 채웁니다.</p>`:'<p>먼저 직접 조종할 선수를 고르세요. 관전만 하려면 "관전 모드"를 누르세요.</p>'}
   <div class="row">
    ${s.a||s.watch?`<button class="btn gold" data-go="gpGo" data-v="top">강한 순서로 채우고 시작</button><button class="btn" data-go="gpGo" data-v="rand">무작위로 채우고 시작</button>`:`<button class="btn" data-go="gpWatch">관전 모드</button>`}

  panel.querySelectorAll('.card').forEach(c=>c.onclick=()=>{SFX.sel();au();const f=FBY[c.dataset.f];
    if(!s.a&&!s.watch){s.a=f}else if(f===s.a){if(!s.ent.length)s.a=null}else{const i=s.ent.indexOf(f);if(i>=0)s.ent.splice(i,1);else if(s.ent.length<n-(s.watch?0:1))s.ent.push(f)}NAV.gpPick()});

NAV.gpTab=v=>{SEL.tab=v;NAV.gpPick()};

NAV.gpGo=how=>{
  const n=FLOW.size,rule=FLOW.rule,s=SEL;let ent=(s.a?[s.a]:[]).concat(s.ent);
  let pool=FT.filter(f=>!ent.includes(f)&&(rule==='K'?f.org!=='P':f.org!=='K'));
  if(pool.length<n-ent.length)pool=FT.filter(f=>!ent.includes(f));
  if(how==='top')pool.sort((x,y)=>rating(y,rule)-rating(x,rule));else pool.sort(()=>Math.random()-.5);
  ent=ent.concat(pool.slice(0,n-ent.length));
  // 시드: 강한 순 정렬 후 1-8, 4-5 ... 배치
  const sorted=ent.slice().sort((x,y)=>rating(y,rule)-rating(x,rule));
  const order=n===8?[0,7,3,4,1,6,2,5]:[0,15,7,8,3,12,4,11,1,14,6,9,2,13,5,10];
  const seeded=order.map(i=>sorted[i]);if(how==='rand')seeded.sort(()=>Math.random()-.5);
  const R0=[];for(let i=0;i<n;i+=2)R0.push({a:seeded[i].id,b:seeded[i+1].id,w:null,m:''});
  GP={rule,size:n,user:s.watch?null:s.a.id,rounds:[R0],carry:{},alive:1};
  gpBracket();
};
function gpRoundName(ri){const n=GP.size/Math.pow(2,ri);return n===2?'결승':n===4?'준결승':n===8?(GP.size===16?'2회전 (8강)':'8강'):'개막전 (16강)'}
function gpNight(ri){const n=GP.size/Math.pow(2,ri);if(GP.rule==='K'&&GP.size===8)return'결승 대회';return n<=4?'결승 대회':n===8?(GP.size===16?'2회전 대회':'개막 대회'):'개막전'}
function gpNext(){for(let ri=0;ri<GP.rounds.length;ri++){const R=GP.rounds[ri];for(let mi=0;mi<R.length;mi++)if(!R[mi].w)return[ri,mi]}return null}
function gpBracket(){
  const nx=gpNext();const cols=Math.log2(GP.size);

    html+=`<p style="color:var(--ink);font-size:18px">${gpNight(nx[0])} · ${gpRoundName(nx[0])} ${nx[1]+1}경기 — <b>${A.nm}</b> vs <b>${B.nm}</b></p>
    <div class="row">${mine?`<button class="btn gold" id="gpPlay">내 경기 시작</button>`:`<button class="btn gold" id="gpSim">결과 시뮬레이션</button><button class="btn" id="gpWatchOne">이 경기 관전</button><button class="btn" id="gpSimAll">${GP.user?'내 경기 전까지 모두 시뮬':'남은 경기 모두 시뮬'}</button>`}<button class="btn" data-go="title">메인 메뉴 (진행 중단)</button></div>`}
  else{const ch=FBY[GP.champ];html+=`<p style="color:var(--gold);font-size:22px">우승: ${ch.fl} ${ch.nm}</p><div class="row"><button class="btn gold" data-go="gp">새 그랑프리</button><button class="btn" data-go="title">메인 메뉴</button></div>`}
  html+='<div class="bracket"><div class="bk">';
  for(let ri=0;ri<cols;ri++){const R=GP.rounds[ri]||[];const cnt=GP.size/Math.pow(2,ri+1);
    html+=`<div class="col"><h4>${gpRoundName(ri)}</h4>`;
    for(let mi=0;mi<cnt;mi++){const m=R[mi];
      if(!m){html+=`<div class="bm"><div>&nbsp;</div><div>&nbsp;</div></div>`;continue}
      const cls=id=>(m.w?(m.w===id?'w':'l'):'')+(id===GP.user?' me':'');
      const now=nx&&nx[0]===ri&&nx[1]===mi;
      html+=`<div class="bm ${now?'now':''}"><div class="${cls(m.a)}">${FBY[m.a].nm}${m.w===m.a?' <small>'+m.m+'</small>':''}</div><div class="${cls(m.b)}">${FBY[m.b].nm}${m.w===m.b?' <small>'+m.m+'</small>':''}</div></div>`}
    html+='</div>'}
  html+='</div></div><p class="note">같은 대회(밤)에 열리는 다음 경기에는 앞 경기의 데미지가 일부 남습니다.</p>';
  show(html);
  if(nx){const m=GP.rounds[nx[0]][nx[1]];
    const p=$('#gpPlay');if(p)p.onclick=()=>{SFX.sel();au();gpPlay(nx,'human')};
    const s=$('#gpSim');if(s)s.onclick=()=>{SFX.sel();gpSim(nx);gpBracket()};
    const w=$('#gpWatchOne');if(w)w.onclick=()=>{SFX.sel();au();gpPlay(nx,'cpu')};
    const a=$('#gpSimAll');if(a)a.onclick=()=>{SFX.sel();let q;while((q=gpNext())){const mm=GP.rounds[q[0]][q[1]];if(GP.user&&(mm.a===GP.user||mm.b===GP.user))break;gpSim(q)}gpBracket()};}
}
function carryOf(id,ri){const c=GP.carry[id];if(!c||c.night!==gpNight(ri))return null;return{hp:clamp(100-(100-c.hp)*.4,55,100),leg:clamp(100-(100-c.leg)*.5,50,100)}}
function gpSim(nx){
  const m=GP.rounds[nx[0]][nx[1]],A=FBY[m.a],B=FBY[m.b],rule=GP.rule;
  const ca=carryOf(A.id,nx[0]),cb=carryOf(B.id,nx[0]);
  const sa=rating(A,rule)+(A.kg-100)*.04-(ca?(100-ca.hp)*.2:0),sb=rating(B,rule)+(B.kg-100)*.04-(cb?(100-cb.hp)*.2:0);
  const pA=1/(1+Math.exp(-(sa-sb)/9));const W=Math.random()<pA?A:B,L=W===A?B:A;
  let m2;const r=Math.random();
  if(rule==='K'){m2=r<.45?`${1+Math.floor(Math.random()*3)}R KO (${pick(W.kic>W.pun?['하이킥','로킥','니킥','미들킥']:['훅','스트레이트','어퍼컷','니킥'])})`:'판정 '+pick(['3-0','3-0','2-0','2-1'])}
  else{const subP=W.sub/100*.5;m2=r<subP?`서브미션 (${W.sp==='armbar'?W.spn:pick(SUBN.bot.concat(SUBN.top))})`:r<subP+.4?`${1+Math.floor(Math.random()*2)}R ${pick(['KO','TKO'])} (${pick(['파운딩','훅','사커킥','니킥','하이킥'])})`:'판정 '+pick(['3-0','2-1'])}
  gpRecord(nx,W.id,m2,{hp:rnd(45,95),leg:rnd(60,100)});
}
function gpRecord(nx,wid,mt,wc){
  const [ri,mi]=nx,m=GP.rounds[ri][mi];m.w=wid;m.m=mt;GP.carry[wid]=Object.assign({night:gpNight(ri)},wc);
  const R=GP.rounds[ri];
  if(R.every(x=>x.w)){if(R.length===1){GP.champ=wid;HOF.push({date:new Date().toLocaleDateString('ko-KR'),rule:GP.rule,size:GP.size,id:wid});store.set('kp_hof',HOF.slice(-30));return}
    const N=[];for(let i=0;i<R.length;i+=2)N.push({a:R[i].w,b:R[i+1].w,w:null,m:''});GP.rounds[ri+1]=N}
}
function gpPlay(nx,mode){
  const m=GP.rounds[nx[0]][nx[1]];let A=FBY[m.a],B=FBY[m.b];
  if(GP.user===m.b){[A,B]=[B,A]}
  const ca=carryOf(A.id,nx[0]),cb=carryOf(B.id,nx[0]);
  startMatch({mode:mode==='human'?'gp':'watch',rule:GP.rule,a:A,b:B,ca:mode==='human'?'human':'cpu',cb:'cpu',carryA:ca,carryB:cb,
    title:gpRoundName(nx[0]),gpLabel:gpRoundName(nx[0]),
    onEnd:(res,g)=>{const W=res.win;gpRecord(nx,W.d.id,res.method==='판정'?'판정 '+(g.judges?g.judges.kind.split(' ')[0]:''):`${res.round>3?'연장':res.round+'R'} ${res.method}`+(res.method==='판정'?'':` (${res.detail})`),{hp:W.hp,leg:W.leg});
      const lost=GP.user&&res.lose.d.id===GP.user;
      show(`<h2>${W.d.nm} 승리</h2><p style="color:var(--ink);font-size:18px">${methodText(res)}</p>
       ${lost?'<p>내 선수가 탈락했습니다. 남은 경기는 시뮬레이션하거나 관전할 수 있습니다.</p>':''}
       <div class="row"><button class="btn gold" id="gpCont">대진표로</button><button class="btn" data-go="title">메인 메뉴</button></div>`);
      if(lost)GP.user=null;
      $('#gpCont').onclick=()=>{SFX.sel();G=null;attract();gpBracket()}}});
}
